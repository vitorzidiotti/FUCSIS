{% extends "base.html" %}

{% block title %}Login - FUCSIS{% endblock %}

{% block content %}
<div class="auth-container" style="margin-top: 6rem; max-width: 400px;">
    <div class="auth-header" style="text-align: center; margin-bottom: 2rem;">
        {# Substituição do título de texto pela Logo em PNG #}
<img src="{{ url_for('static', filename='img/logo_fucsis.png') }}" alt="Logo FUCSIS" class="auth-logo" style="width: 100%; max-width: 550px; display: block; margin: 0 auto 0.5rem auto; height: auto;">        <p style="font-size: 0.9rem; color: #666;">Entre com suas credenciais para continuar.</p>
    </div>

    <form method="POST" class="auth-form">
        <div class="form-group">
            <label for="email">E-mail:</label>
            <input type="email" name="email" id="email" value="{{ email_salvo | default('') }}" required>
        </div>

        <div class="form-group">
            <label for="senha">Senha:</label>
            <div class="password-wrapper">
                <input type="password" name="senha" id="senha" required>
                <span class="toggle-password" id="togglePassword" title="Mostrar senha">👁️</span>
            </div>
        </div>

        <div style="margin-top: 2rem;">
            <button type="submit" class="btn btn-green" style="width: 100%; padding: 14px; font-size: 1rem; font-weight: bold;">
                Entrar
            </button>
        </div>
    </form>

    <div class="auth-switch" style="text-align: center; margin-top: 1.5rem; border-top: 1px solid #eee; padding-top: 1.5rem;">
        <p style="font-size: 0.9rem; color: #666;">
            Ainda não possui uma conta? <a href="{{ url_for('auth.cadastro') }}" style="color: #2e7d32; font-weight: 600;">Cadastre-se aqui</a>
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const togglePassword = document.querySelector('#togglePassword');
        const passwordInput = document.querySelector('#senha');
        
        if (togglePassword && passwordInput) {
            togglePassword.addEventListener('click', function () {
                // Alterna entre password e text
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                // Alterna o ícone (Olho / Macaco Cego)
                this.textContent = type === 'password' ? '👁️' : '🙈';
                this.title = type === 'password' ? "Mostrar senha" : "Ocultar senha";
            });

            // Pequeno feedback visual no input ao focar no ícone
            togglePassword.addEventListener('mouseenter', () => {
                if(passwordInput.getAttribute('type') === 'password') passwordInput.style.borderColor = "#2e7d32";
            });
            togglePassword.addEventListener('mouseleave', () => {
                passwordInput.style.borderColor = "#ced4da";
            });
        }
    });
</script>
{% endblock %}
